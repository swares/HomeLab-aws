# ---------------------------------------------------------------------------
# REFERENCE COPY ONLY - do not apply this by hand.
#
# The live root Application is rendered by the `argocd-apps` Helm release in
# tofu/argocd.tf, installed only after the argo-cd release has created the
# Application CRD. This file exists so the app-of-apps shape is readable
# without digging through HCL.
#
# If you edit one, edit both. They will drift otherwise, and the HCL is the
# one that runs.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/swares/HomeLab-aws.git
    targetRevision: main
    path: gitops/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
