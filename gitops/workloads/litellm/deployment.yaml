# The ServiceAccount `litellm` is NOT in git. Tofu creates it (tofu/litellm.tf)
# because its role-arn annotation contains the account ID and this repo is
# public. If this Deployment ever syncs before the SA exists, pods fail with
# "serviceaccount not found" and the ReplicaSet retries until it appears;
# tofu orders the SA before Argo's root app, so that should not happen.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
      annotations:
        # Roll the pod when the model config changes.
        config-version: "2"
    spec:
      serviceAccountName: litellm
      # LiteLLM never calls the Kubernetes API, so no in-cluster API token.
      # IRSA is unaffected: the EKS pod-identity webhook mounts its own projected
      # token (aud=sts.amazonaws.com) at /var/run/secrets/eks.amazonaws.com/
      # serviceaccount/token regardless of this flag. `make irsa-check` proves it.
      automountServiceAccountToken: false
      containers:
        - name: litellm
          # Pinned: Kyverno disallow-latest-tag rejects anything else.
          # v1.101.0 = latest stable on the GitHub releases page, 2026-09-22.
          image: ghcr.io/berriai/litellm:v1.101.0
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            # boto3 uses this for STS; regional endpoint, not the global one.
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
            # Direct-API fallback key. The Secret is NOT in git and NOT in Tofu:
            # `make litellm-key` prompts for it and creates it in-cluster, and it
            # dies with the cluster nightly. optional: true so the pod starts
            # without it - Bedrock works, only the fallback fails. Argo does not
            # prune it: Argo only prunes objects it created.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-anthropic
                  key: api-key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/liveliness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          # Kyverno require-resource-limits: cpu AND memory limits required.
          # ephemeral-storage bounds writable-layer use (logs, pip/prisma caches)
          # so one pod cannot fill a t3 node's 20 GiB root volume.
          resources:
            requests: { cpu: 100m, memory: 384Mi, ephemeral-storage: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi,   ephemeral-storage: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap:
            name: litellm-config
