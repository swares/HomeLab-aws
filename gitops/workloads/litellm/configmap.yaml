# LiteLLM routing config. One client-facing model, two backends.
#
# Clients ask for `claude-haiku` (OpenAI-style `model_name`). LiteLLM sends it
# to Bedrock first; if Bedrock fails - most likely a 429 while the account's
# Haiku quota is still at its new-account default - it retries the same
# request against the Anthropic API directly (`claude-haiku-direct`).
#
# THE MODEL IS DECLARED IN THREE PLACES and they move together:
#   - here, twice: the Bedrock inference profile ID and the Anthropic API ID
#   - tofu/litellm.tf `bedrock_model_id` (the IAM policy's resource ARNs)
#   - docs/RUNBOOK.md (the admin first-call, by Bedrock ID)
# Changing only this file gets you AccessDenied on the Bedrock half, which
# LiteLLM then silently papers over with the fallback. `make litellm-smoke`
# prints which backend answered, so look at it after any model change.
#
# Bedrock: the US INFERENCE PROFILE ID, not the bare model ID - in us-east-1
# bedrock-runtime rejects the bare ID for on-demand calls. No AWS credentials
# anywhere: boto3 finds AWS_ROLE_ARN + AWS_WEB_IDENTITY_TOKEN_FILE (injected by
# EKS because of the ServiceAccount's role annotation). That is IRSA; see
# tofu/litellm.tf.
#
# Anthropic direct: the ONE static credential in this repo's design. It is
# never in git, Tofu state, or on disk: `make litellm-key` prompts for it and
# writes it straight into the Secret `litellm-anthropic`, which dies with the
# cluster every night. The Deployment marks that Secret optional, so without
# `make litellm-key` the pod still starts, the Bedrock path is unaffected, and only the
# fallback fails. `os.environ/` is resolved when LiteLLM starts, so a key added
# later needs a pod restart - `make litellm-key` does that.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      - model_name: claude-haiku
        litellm_params:
          model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
          aws_region_name: us-east-1
        model_info:
          # Returned in the x-litellm-model-id response header, which is how
          # `make litellm-smoke` reports which backend served the request.
          id: bedrock-haiku

      - model_name: claude-haiku-direct
        litellm_params:
          model: anthropic/claude-haiku-4-5-20251001
          api_key: os.environ/ANTHROPIC_API_KEY
        model_info:
          id: anthropic-haiku

      # Phase 2b: the M5Stack adapter (gitops/workloads/m5stack), which in the
      # sandbox drives a stub device, not hardware. The adapter speaks OpenAI,
      # so these are openai/ routes; `model` is the ADAPTER's model name
      # (m5-route, m5-llm), `model_name` is what clients ask for. Same names
      # as the lab's AI routing: `m5` = the full escalation router.
      # api_key is required by the openai provider and ignored by the
      # adapter - it is not a credential. No fallback: a stub that fails
      # should fail visibly, not be papered over by Claude.
      - model_name: m5
        litellm_params:
          model: openai/m5-route
          api_base: http://m5stack-adapter.m5stack.svc:8080/v1
          api_key: unused
        model_info:
          id: m5stack-route

      - model_name: m5-llm
        litellm_params:
          model: openai/m5-llm
          api_base: http://m5stack-adapter.m5stack.svc:8080/v1
          api_key: unused
        model_info:
          id: m5stack-llm

    litellm_settings:
      # Never send prompt/response bodies to any callback or log sink.
      turn_off_message_logging: true
      drop_params: true
      # One retry on Bedrock before falling back, not the default three: a
      # zero/low quota is not transient, and each retry is added latency.
      num_retries: 1
      fallbacks:
        - claude-haiku: ["claude-haiku-direct"]

    # Phase 2a: the Ingress (ingress.yaml) and this key arrived TOGETHER -
    # never one without the other. Every /v1 call needs
    # "Authorization: Bearer <key>"; the health probes stay open.
    # The value comes from the Tofu-created Secret litellm-master-key via the
    # Deployment's LITELLM_MASTER_KEY, which is required, not optional: if it
    # were unset LiteLLM would run with no auth at all.
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
