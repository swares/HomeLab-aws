# ClusterIP. Never type LoadBalancer: that would create an NLB with none of
# the Ingress's safeguards. Outside access goes ONLY through ingress.yaml (an
# ALB limited to alb_allowed_cidrs and to /v1, with the master key required).
# In-cluster and port-forward access (`make litellm-smoke`) still come here.
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
