# ClusterIP only. LiteLLM reaches it at http://m5stack-adapter.m5stack:8080/v1.
apiVersion: v1
kind: Service
metadata:
  name: m5stack-adapter
  labels:
    app.kubernetes.io/name: m5stack-adapter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: m5stack-adapter
  ports:
    - name: http
      port: 8080
      targetPort: http
