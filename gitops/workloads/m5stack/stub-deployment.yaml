# m5-stub: the "device". Stock python image, code from the m5-stub-code
# ConfigMap (stub.py, generated by kustomization.yaml). Standard library only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m5-stub
  labels:
    app.kubernetes.io/name: m5-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: m5-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: m5-stub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: stub
          # Pinned: Kyverno disallow-latest-tag. Same image as the phase-2
          # echo test in docs/RUNBOOK.md.
          image: python:3.12-slim
          command: ["python", "/app/stub.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: code
          configMap:
            name: m5-stub-code
