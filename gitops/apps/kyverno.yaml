# Kyverno itself (Helm chart). Wave -1: the admission controller and its CRDs
# must exist and be ready before any ClusterPolicy is applied, or the policy
# apply fails with "no matches for kind ClusterPolicy".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    # 3.9.1 ships Kyverno v1.19.1. Was 3.3.7 (v1.13.x, built for ~k8s 1.28-1.31).
    # Newer charts enable --generateValidatingAdmissionPolicy by default, so
    # expect native ValidatingAdmissionPolicy objects alongside the three
    # ClusterPolicies. Expected, not drift.
    targetRevision: 3.9.1
    helm:
      values: |
        # Single replica across the board - sandbox, not HA.
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        cleanupController:
          replicas: 1
        reportsController:
          replicas: 1
        # NOT COSMETIC - removing either map brings back perpetual OutOfSync.
        # The kyverno-api subchart (0.0.1-alpha.4) renders CRD metadata with
        # `toYaml .Values.labels`, and toYaml of an empty map is `{}`. So with
        # its defaults every policies.kyverno.io CRD is rendered with
        # `labels: {}` and `annotations: {}`; the API server drops empty maps,
        # and Argo reported all 11 CRDs OutOfSync forever (found 2026-09-21).
        # Any non-empty value fixes it. These two also say something true.
        kyverno-api:
          labels:
            app.kubernetes.io/part-of: kyverno
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno's CRDs exceed the 256KB annotation limit that kubectl's
      # client-side apply uses to store last-applied-configuration.
      - ServerSideApply=true
